<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1B5E20">
<title>GPL Representação</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f4f1;color:#222}
.top{background:#1B5E20;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top img{height:38px}
.top .tt{flex:1;min-width:0}.top b{font-size:15px;display:block}.top small{font-size:11px;opacity:.85}
.st{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.18);white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding:10px 12px 90px}
.card{background:#fff;border:1px solid #e3e8e3;border-radius:14px;padding:12px 14px;margin:10px 0}
.sec{font-size:11px;font-weight:800;color:#888;letter-spacing:.06em;margin:16px 2px 4px}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k div{background:#fff;border:1px solid #e3e8e3;border-radius:12px;padding:10px;text-align:center}
.k b{display:block;font-size:20px;color:#1B5E20}.k span{font-size:10.5px;color:#777}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:8px 0;border-bottom:1px solid #f0f0f0}
.row:last-child{border:none}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.r{background:#FFEBEE;color:#C62828}.y{background:#FFF8E1;color:#E65100}.g{background:#E8F5E9;color:#1B5E20}.cz{background:#eee;color:#555}
.btn{display:block;width:100%;background:#1B5E20;color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:14px;margin:8px 0;cursor:pointer}
.btn2{background:#E8F5E9;color:#1B5E20;border:1px solid #A5D6A7}
.btn3{background:#fff;color:#C62828;border:1px solid #ef9a9a}
.bs{display:inline-flex;align-items:center;gap:5px;background:#E8F5E9;color:#1B5E20;border:1px solid #A5D6A7;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer}
label{display:block;font-size:11.5px;color:#666;margin-top:9px}
input,select,textarea{width:100%;border:1px solid #d6d6d6;border-radius:8px;padding:9px;font-size:14px;margin-top:3px;background:#fff;font-family:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
h3{margin:0 0 6px;font-size:15px;color:#1B5E20}
.muted{color:#777;font-size:12px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu div{background:#fff;border:1px solid #e3e8e3;border-radius:14px;padding:12px;cursor:pointer}
.menu b{color:#1B5E20;font-size:14px;display:flex;align-items:center;gap:6px}
.lt{border-left:4px solid #2E7D32;padding:6px 0 6px 10px;margin:8px 0}
.back{background:none;border:none;color:#1B5E20;font-weight:700;font-size:15px;padding:6px 0;cursor:pointer}
.li{cursor:pointer}
.tot{font-size:18px;font-weight:800;color:#1B5E20}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:6}
.nav div{flex:1;text-align:center;padding:8px 0 10px;font-size:11px;color:#777;cursor:pointer}
.nav div.on{color:#1B5E20;font-weight:700}
.nav svg{display:block;margin:0 auto 2px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:20}
.ok{color:#1B5E20}.err{color:#C62828}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;color:#777;font-weight:600;border-bottom:1px solid #ddd;padding:5px 4px}
table.t td{border-bottom:1px solid #f0f0f0;padding:5px 4px}
</style>
</head>

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function num(v){if(typeof v==='number')return isNaN(v)?0:v;var t=String(v==null?'':v).replace(/[^\d,.\-]/g,'');if(t.indexOf(',')>=0)t=t.replace(/\./g,'').replace(',','.');var n=parseFloat(t);return isNaN(n)?0:n;}
function fmt(n,d){d=d==null?0:d;return Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function brl(n){return 'R$ '+fmt(n,2);}
function p2(n){return ('0'+n).slice(-2);}
function hoje(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function br(iso){return iso?String(iso).substring(8,10)+'/'+String(iso).substring(5,7)+'/'+String(iso).substring(0,4):'—';}
function somaDias(iso,n){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+Math.round(n));return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function difDias(a,b){return Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);}
function mascFone(v){var d=String(v||'').replace(/\D/g,'');if(d.length>11&&d.indexOf('55')===0)d=d.slice(2);d=d.slice(0,11);if(!d)return '';if(d.length<=2)return '('+d;if(d.length<=6)return '('+d.slice(0,2)+') '+d.slice(2);if(d.length<=10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);}

function api(acao,data,cb){
  if(!GAS||GAS.indexOf('%%')===0){ if(cb)cb({ok:false,erro:'URL do Apps Script não configurada'}); return; }
  var n='rep_cb_'+Date.now()+Math.floor(Math.random()*999), s=document.createElement('script'), feito=false;
  var t=setTimeout(function(){ if(feito)return; feito=true; delete window[n]; if(s.parentNode)s.parentNode.removeChild(s); if(cb)cb({ok:false,erro:'sem resposta da planilha'}); },30000);
  window[n]=function(r){ if(feito)return; feito=true; clearTimeout(t); delete window[n]; if(s.parentNode)s.parentNode.removeChild(s); if(cb)cb(r||{ok:false}); };
  s.onerror=function(){ if(feito)return; feito=true; clearTimeout(t); delete window[n]; if(cb)cb({ok:false,erro:'sem conexão'}); };
  s.src=GAS+'?acao='+acao+'&callback='+n+(data?'&data='+encodeURIComponent(JSON.stringify(data)):'')+'&t='+Date.now();
  document.body.appendChild(s);
}

// ── cálculo do consumo (lógica conferida pelo Rogério) ──
// kg/dia = cab × peso médio ÷ 100 × dose(g/100 kg PV) ÷ 1000
// Arredondar: leva o kg/dia para a fração de saco mais próxima (ex.: 1/2 saco de 30 kg = 15 kg; 21 kg/dia → 15 kg/dia)
function calcItem(it,dias,fator){
  var p=prod(it.prod), saco=num(p.Saco_kg)||30;
  var kgCalc=num(it.cab)*num(it.peso)/100*num(it.dose)/1000;
  var kg=kgCalc, fr=num(it.arred);
  if(fr>0 && kgCalc>0){ var f=saco/fr; kg=Math.max(f,Math.round(kgCalc/f)*f); }
  var kgReal=kg*(fator||1);
  var sacos=kg>0?Math.ceil(kg*num(dias)/saco):0;
  var dur=kgReal>0?sacos*saco/kgReal:0;
  return {saco:saco,kgCalc:kgCalc,kg:kg,gCab:num(it.cab)?kg*1000/num(it.cab):0,sacos:sacos,dur:dur};
}
function fatorCliente(cid){ // último consumo real registrado (1 = igual ao previsto; 1,2 = come 20% a mais)
  var v=S.orcamentos.filter(function(o){return String(o.Cliente_ID)===String(cid)&&num(o.Fator_Real)>0;})
    .sort(function(a,b){return String(b.Fim_Real).localeCompare(String(a.Fim_Real));});
  return v.length?num(v[0].Fator_Real):1;
}
function totaisOrc(o){
  var j=itensDe(o), tot=0, sacos=0, porProd={}, minDur=null;
  j.itens.forEach(function(it){
    var c=calcItem(it,o.Dias||j.dias||30,1); sacos+=c.sacos;
    porProd[it.prod]=(porProd[it.prod]||0)+c.sacos;
    if(c.dur>0) minDur=minDur==null?c.dur:Math.min(minDur,c.dur);
  });
  Object.keys(porProd).forEach(function(pid){ tot+=porProd[pid]*num((j.precos||{})[pid]); });
  tot+=num(o.Frete);
  return {total:tot,sacos:sacos,porProd:porProd,minDur:minDur||0};
}

// ── importar pesagem: CSV do bastão (EID;VID;Date;...;LOTE;PESO) ou Excel (planilha de pesagem / pesagem-curral) ──
var IMP=null;
function importar(inp){
  var f=inp.files&&inp.files[0]; if(!f)return; inp.value='';
  var rd=new FileReader();
  if(/\.csv$|\.txt$/i.test(f.name)){ rd.onload=function(e){ try{ var txt=e.target.result, lin=txt.split(/\r\n|\r|\n/), sep=(lin[0].split(';').length>1)?';':','; prepImport(lin.filter(function(l){return l.trim();}).map(function(l){return l.split(sep);})); }catch(x){alert('Não consegui ler o arquivo.');} }; rd.readAsText(f,'utf-8'); }
  else { rd.onload=function(e){ try{ var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true}); prepImport(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null})); }catch(x){alert('Não consegui ler a planilha.');} }; rd.readAsArrayBuffer(f); }
}
function isoDe(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v)){var d=new Date(v.getTime()+12*3600e3);return d.toISOString().slice(0,10);}
  if(typeof v==='number'&&v>20000&&v<80000){var d2=new Date(Math.round((v-25569)*864e5)+12*3600e3);return d2.toISOString().slice(0,10);}
  var t=String(v).trim(),m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){var y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+p2(m[2])+'-'+p2(m[1]);}
  return '';
}
function prepImport(rows){
  var hi=-1,cP=-1,cL=-1,cD=-1,cS=-1;
  for(var i=0;i<Math.min(rows.length,30);i++){
    var r=(rows[i]||[]).map(function(x){return String(x==null?'':x).trim().toLowerCase();});
    var p=r.findIndex(function(x){return /^peso/.test(x);});
    if(p>=0){hi=i;cP=p;cL=r.findIndex(function(x){return /^lote/.test(x);});cD=r.findIndex(function(x){return /^(date|data)/.test(x);});cS=r.findIndex(function(x){return /^sexo/.test(x);});break;}
  }
  if(hi<0){alert('Não achei a coluna de PESO no arquivo.');return;}
  var g={},ordem=[];
  for(var k=hi+1;k<rows.length;k++){
    var row=rows[k]||[], peso=num(row[cP]); if(!(peso>0))continue;
    var lote=cL>=0&&row[cL]!=null&&String(row[cL]).trim()!==''?String(row[cL]).trim():'Lote 1';
    if(/^\d+$/.test(lote))lote='Lote '+lote;
    if(!g[lote]){g[lote]={n:0,soma:0,data:'',sexo:{}};ordem.push(lote);}
    g[lote].n++;g[lote].soma+=peso;
    var d=cD>=0?isoDe(row[cD]):''; if(d&&d>g[lote].data)g[lote].data=d;
    if(cS>=0&&row[cS])g[lote].sexo[String(row[cS]).trim().toUpperCase().charAt(0)]=1;
  }
  if(!ordem.length){alert('Nenhum animal com peso encontrado.');return;}

  Object.keys(ED._j.precos||{}).forEach(function(pid){var p=S.produtos.find(function(x){return x.ID===pid;});if(p&&num(ED._j.precos[pid])&&num(p.Preco)!==num(ED._j.precos[pid])){p.Preco=num(ED._j.precos[pid]);api('salvar',{aba:'Produtos',reg:{ID:pid,Preco:p.Preco}},function(){});}});

  var h=cabPDF('Orçamento')+'<div style="padding:14px 22px">';

  h+='<div style="font-weight:800;color:#1B5E20;font-size:13px;margin:6px 0">Recomendação por lote · período de '+ED.Dias+' dias</div><table style="width:100%;border-collapse:collapse;font-size:11px"><tr style="background:#1B5E20;color:#fff"><th style="padding:5px;text-align:left">Lote</th><th style="text-align:left">Categoria</th><th>Cab</th><th>Peso</th><th style="text-align:left">Produto</th><th>g/cab/dia</th><th>kg/dia</th><th>Sacos</th></tr>';
  j.itens.forEach(function(it,i){var k=calcItem(it,ED.Dias,1);h+='<tr style="background:'+(i%2?'#fff':'#f5f7f5')+';text-align:center"><td style="padding:5px;text-align:left">'+esc(it.lote)+'</td><td style="text-align:left">'+esc(it.cat||'')+'</td><td>'+fmt(it.cab)+'</td><td>'+fmt(it.peso)+' kg</td><td style="text-align:left">'+esc(prod(it.prod).Nome)+'</td><td>'+fmt(k.gCab)+'</td><td>'+fmt(k.kg,1)+'</td><td><b>'+k.sacos+'</b></td></tr>';});
  h+='</table>';
  h+='<div style="font-weight:800;color:#1B5E20;font-size:13px;margin:14px 0 6px">Valores</div><table style="width:100%;border-collapse:collapse;font-size:12px">';
  Object.keys(t.porProd).forEach(function(pid){var pr=num(j.precos[pid]);h+='<tr style="border-bottom:1px solid #eee"><td style="padding:5px">'+esc(prod(pid).Nome)+'</td><td style="text-align:center">'+t.porProd[pid]+' sacos</td><td style="text-align:right">'+(pr?brl(pr)+'/saco':'—')+'</td><td style="text-align:right;font-weight:700">'+(pr?brl(pr*t.porProd[pid]):'—')+'</td></tr>';});
  if(num(ED.Frete))h+='<tr style="border-bottom:1px solid #eee"><td style="padding:5px" colspan="3">Frete</td><td style="text-align:right;font-weight:700">'+brl(num(ED.Frete))+'</td></tr>';
  h+='<tr style="background:#E8F5E9"><td style="padding:7px;font-weight:800" colspan="3">TOTAL</td><td style="text-align:right;font-weight:800;font-size:14px;color:#1B5E20">'+brl(t.total)+'</td></tr></table>';
  h+='<div style="font-size:12px;margin-top:8px"><b>Forma de pagamento:</b> '+esc(ED.Pagamento||'a combinar')+(ED.Obs?'<br><b>Obs.:</b> '+esc(ED.Obs):'')+'</div>';
  h+='<div style="font-weight:800;color:#1B5E20;font-size:13px;margin:16px 0 0">Produtos e níveis de garantia</div>';
  Object.keys(t.porProd).forEach(function(pid){h+=fichaPDF(pid);});
  h+='<div style="border-top:1px solid #ccc;margin-top:14px;padding-top:8px;font-size:11px;color:#555;display:flex;justify-content:space-between"><span>'+EMPRESA.assin+' · '+EMPRESA.fone+'</span><span>'+EMPRESA.fantasia+'</span></div></div>';
  gerarPDF(h,nomeArq('Orcamento'));
}
function pdfPedido(){
  var c=cli(ED.Cliente_ID), j=ED._j, t=totaisOrc({Itens_JSON:JSON.stringify(j),Dias:ED.Dias,Frete:ED.Frete});
  var _mk=[];Object.keys(t.porProd).forEach(function(pid){var m=fichaDe(pid).marca;if(m&&_mk.indexOf(m)<0)_mk.push(m);});var h=cabPDF('Pedido'+(_mk.length?' — '+_mk.join(' / '):''))+'<div style="padding:16px 22px;font-size:12.5px">';
  h+='<table style="width:100%;margin-bottom:12px"><tr><td><b>Cliente:</b> '+esc(c.Nome||'')+'<br><b>Fazenda:</b> '+esc(c.Fazenda||'')+'<br><b>Cidade:</b> '+esc(c.Cidade||'')+'<br><b>Contato:</b> '+esc(c.Telefone||'')+'</td><td style="text-align:right;vertical-align:top"><b>Data:</b> '+br(ED.Data)+(ED.Data_Venda?'<br><b>Entrega:</b> '+br(ED.Data_Venda):'')+'</td></tr></table>';
  h+='<table style="width:100%;border-collapse:collapse"><tr style="background:#1B5E20;color:#fff"><th style="padding:6px;text-align:left">Produto</th><th>Marca</th><th>Embalagem</th><th>Quantidade</th></tr>';
  var tkg=0;Object.keys(t.porProd).forEach(function(pid,i){var p=prod(pid),kg=t.porProd[pid]*(num(p.Saco_kg)||30);tkg+=kg;h+='<tr style="background:'+(i%2?'#fff':'#f5f7f5')+';text-align:center"><td style="padding:6px;text-align:left">'+esc(p.Nome)+'</td><td>'+esc(fichaDe(pid).marca||'')+'</td><td>Saco '+fmt(num(p.Saco_kg)||30)+' kg</td><td><b>'+t.porProd[pid]+' sacos</b> ('+fmt(kg)+' kg)</td></tr>';});
  h+='<tr style="background:#E8F5E9"><td style="padding:6px;font-weight:800" colspan="3">TOTAL</td><td style="text-align:center;font-weight:800">'+t.sacos+' sacos · '+fmt(tkg)+' kg</td></tr></table>';
  if(ED.Obs)h+='<div style="margin-top:10px"><b>Obs.:</b> '+esc(ED.Obs)+'</div>';
  h+='<div style="border-top:1px solid #ccc;margin-top:24px;padding-top:8px;font-size:11px;color:#555">'+EMPRESA.assin+' · Representante · '+EMPRESA.fone+'</div></div>';
  gerarPDF(h,nomeArq('Pedido_'+(_mk[0]||'fornecedor')));

// ── PRODUTOS (qualquer marca; ficha e níveis de garantia editáveis no app) ──
var CORES=[['#2E7D32','Verde'],['#1565C0','Azul'],['#E65100','Laranja'],['#6A1B9A','Roxo'],['#C62828','Vermelho'],['#00838F','Turquesa'],['#5D4037','Marrom']];
function clarear(c){var n=parseInt(String(c||'#2E7D32').slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,f=function(x){return Math.round(x+(255-x)*0.9);};return 'rgb('+f(r)+','+f(g)+','+f(b)+')';}
function garTexto(grupos){return (grupos||[]).map(function(g){return '# '+g[0]+'\n'+g[1].map(function(r){return r[0]+' | '+r[1];}).join('\n');}).join('\n');}
function garLer(t){var gs=[],cur=null;String(t||'').split(/\r?\n/).forEach(function(l){l=l.trim();if(!l)return;if(l.charAt(0)==='#'){cur=[l.replace(/^#+\s*/,''),[]];gs.push(cur);return;}
  var k=l.split(/\s*[|;]\s*|\t/);if(k.length<2){var m=l.match(/^(.*\))\s*(.+)$/)||l.match(/^(.*?)\s{2,}(.+)$/);k=m?[m[1],m[2]]:[l,''];}
  if(!cur){cur=['Níveis de garantia',[]];gs.push(cur);} cur[1].push([k[0].trim(),k.slice(1).join(' ').trim()]);});return gs;}
function fichaDe(pid){
  var p=prod(pid), f=FICHA[pid]||{}, cor=p.Cor||f.cor||'#2E7D32';
  return {cor:cor,fundo:clarear(cor),marca:p.Marca||(FICHA[pid]?'Intergrãos':''),classif:p.Classificacao||f.classif||'',indic:p.Indicacao||f.indic||'',
    modo:p.Modo_Usar||f.modo||'',dif:p.Diferenciais||f.dif||'',prec:p.Precaucoes||f.prec||'',grupos:p.Garantias?garLer(p.Garantias):(f.grupos||[])};
}
function vProdutos(){
  var h='<div class="sec">PRODUTOS</div><div class="card">';
  if(!S.produtos.length) h+='<div class="muted">Sem produtos ainda.</div>';
  S.produtos.forEach(function(p){var f=fichaDe(p.ID);
    h+='<div class="row li" onclick="go(\'prod\',\''+p.ID+'\')"><div style="border-left:4px solid '+f.cor+';padding-left:9px"><b>'+esc(p.Nome)+'</b><br><span class="muted">'+esc(f.marca||'—')+' · saco '+fmt(num(p.Saco_kg)||30)+' kg · '+(num(p.Dose_Min)===num(p.Dose_Max)?fmt(num(p.Dose_Min)):fmt(num(p.Dose_Min))+'–'+fmt(num(p.Dose_Max)))+' g/100kg'+(num(p.Preco)?' · '+brl(num(p.Preco)):'')+'</span></div><span class="tag '+(p.Ativo==='nao'?'cz':'g')+'">'+(p.Ativo==='nao'?'inativo':'ativo')+'</span></div>';});
  return h+'</div><button class="btn" onclick="go(\'prod\',\'novo\')">Novo produto (qualquer marca)</button>';
}
function vProd(){
  var novo=PARAM==='novo', p=novo?{Saco_kg:30,Ativo:'sim'}:prod(PARAM), f=novo?{cor:'#2E7D32',grupos:[]}:fichaDe(PARAM);
  var ta=function(id,lab,v,r){return '<label>'+lab+'</label><textarea id="'+id+'" rows="'+(r||2)+'">'+esc(v||'')+'</textarea>';};
  return '<button class="back" onclick="go(\'produtos\')">‹ Produtos</button><div class="card"><h3>'+(novo?'Novo produto':esc(p.Nome))+'</h3>'
   +'<div class="g2"><div><label>Nome do produto</label><input id="pr-nome" value="'+esc(p.Nome)+'"></div><div><label>Marca / fornecedor</label><input id="pr-marca" value="'+esc(f.marca||'')+'"></div></div>'
   +'<div class="g3"><div><label>Saco (kg)</label><input id="pr-saco" inputmode="decimal" value="'+esc(p.Saco_kg)+'"></div><div><label>Dose mín g/100 kg PV</label><input id="pr-dmin" inputmode="numeric" value="'+esc(p.Dose_Min)+'"></div><div><label>Dose máx g/100 kg PV</label><input id="pr-dmax" inputmode="numeric" value="'+esc(p.Dose_Max)+'"></div></div>'
   +'<div class="muted" style="margin-top:4px">Dose fixa (ex.: 100 g por 100 kg)? Coloque o mesmo número no mínimo e no máximo.</div>'
   +'<div class="g3"><div><label>Preço do saco (R$)</label><input id="pr-preco" inputmode="decimal" value="'+(num(p.Preco)?fmt(num(p.Preco),2):'')+'"></div><div><label>Cor no PDF</label><select id="pr-cor">'+CORES.map(function(c){return '<option value="'+c[0]+'"'+(c[0]===f.cor?' selected':'')+'>'+c[1]+'</option>';}).join('')+'</select></div><div><label>Ativo</label><select id="pr-ativo"><option value="sim"'+(p.Ativo!=='nao'?' selected':'')+'>Sim</option><option value="nao"'+(p.Ativo==='nao'?' selected':'')+'>Não</option></select></div></div></div>'
   +'<div class="sec">FICHA DO PRODUTO (VAI NO PDF)</div><div class="card">'
   +ta('pr-classif','Classificação',f.classif)+ta('pr-indic','Indicação',f.indic,1)+ta('pr-modo','Modo de usar',f.modo)+ta('pr-dif','Diferenciais',f.dif,3)+ta('pr-prec','Precauções',f.prec)
   +ta('pr-gar','Níveis de garantia',garTexto(f.grupos),12)
   +'<div class="muted" style="margin-top:4px">Uma linha por item: <b>Nome | valor</b> (ex.: <i>Cálcio (mín) | 39 g/kg</i>). Para separar em grupos, escreva uma linha começando com <b>#</b> (ex.: <i># Microminerais</i>).</div>'
   +'<button class="btn" onclick="salvarProduto()">Salvar produto</button>'+(novo?'':'<button class="btn btn3" onclick="excluirProduto()">Excluir produto</button>')+'</div>';
}
function salvarProduto(){
  var novo=PARAM==='novo', v=function(id){return $(id).value.trim();};
  var reg={ID:novo?'':PARAM,Nome:v('pr-nome'),Marca:v('pr-marca'),Saco_kg:num(v('pr-saco'))||30,Dose_Min:num(v('pr-dmin')),Dose_Max:num(v('pr-dmax'))||num(v('pr-dmin')),
    Preco:num(v('pr-preco'))||'',Cor:v('pr-cor'),Ativo:v('pr-ativo'),Classificacao:v('pr-classif'),Indicacao:v('pr-indic'),Modo_Usar:v('pr-modo'),Diferenciais:v('pr-dif'),Precaucoes:v('pr-prec'),Garantias:v('pr-gar')};
  if(!reg.Nome){alert('Informe o nome do produto.');return;}
  if(!reg.Dose_Min){alert('Informe a dose (g por 100 kg de peso vivo).');return;}
  if(reg.Dose_Max<reg.Dose_Min){alert('A dose máxima não pode ser menor que a mínima.');return;}
  salvar('Produtos',reg,function(ok){if(ok){toast('Produto salvo');go('produtos');}});
}
function excluirProduto(){ if(S.orcamentos.some(function(o){return itensDe(o).itens.some(function(it){return it.prod===PARAM;});})){alert('Este produto está em orçamentos. Em vez de excluir, marque Ativo = Não.');return;}
  if(!confirm('Excluir este produto?'))return;
  api('excluir',{aba:'Produtos',id:PARAM},function(r){if(r&&r.ok){S.produtos=S.produtos.filter(function(p){return p.ID!==PARAM;});cache();go('produtos');}else alert('Não excluiu.');}); }

// ── AJUSTES ──
function vConfig(){
  return '<div class="sec">AJUSTES</div><div class="card"><label>Sua comissão (%) — só aparece pra você</label><input id="cf-com" inputmode="decimal" value="'+esc(cfg('Comissao_Pct'))+'">'
   +'<label>Avisar quantos dias antes de acabar (padrão)</label><input id="cf-al" inputmode="numeric" value="'+esc(cfg('Alerta_Dias')||20)+'">'
   +'<label>Endereço do Apps Script (URL /exec da planilha)</label><input id="cf-gas" value="'+esc(GAS.indexOf('%%')===0?'':GAS)+'" placeholder="https://script.google.com/macros/s/.../exec">'
   +'<button class="btn" onclick="salvarCfg()">Salvar ajustes</button></div>'
   +'<div class="card muted">Empresa no PDF: '+EMPRESA.razao+' · CNPJ '+EMPRESA.cnpj+'</div><button class="btn btn2" onclick="carregar()">Recarregar da planilha</button>';
}
function salvarCfg(){
  var g=$('cf-gas').value.trim(); if(g&&g!==GAS){GAS=g;try{localStorage.setItem('gplrep_gas',g);}catch(e){} carregar(); }
  var a=[['Comissao_Pct',$('cf-com').value.trim().replace(',','.')],['Alerta_Dias',$('cf-al').value.trim()]], n=0;
  a.forEach(function(x){api('salvar_config',{chave:x[0],valor:x[1]},function(r){ if(r&&r.ok){S.config[x[0]]=x[1];cache();} if(++n===a.length){toast('Ajustes salvos');render();} });});
}

render(); carregar();
</script>
